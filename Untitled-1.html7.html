<html>
    <head>
        <title>My Photo Grid</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                font-family: Arial, Helvetica, sans-serif;
                margin:0%;
                padding: 0%;
            }

            header {
                background-color: lavender;
                color: black;
                font-size: 20px;
                padding: 20px;
                text-align: center;
            }

            .container {
                display: grid;
                grid-template-columns: 100px 100px 100px;
                grid-template-rows: 100px 100px;
                grid-gap: 10px;
            }

            .containeritems {
                height: 100px;
                width: 100px;
                object-fit: contain;
                border-radius: 15px;
            }

            footer {
                background-color: darkorchid;
                color: black;
                padding: 10px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>MY PHOTO GRID</h1>
        </header>
        <div class="container">
            <div class="containeritems">
                <img src="bear.jpg" alt="bear.jpg" width="100px" height="100px";>
            </div>    
             <div class="containeritems">
                <img src="bear.jpg" alt="bear.jpg" width="100px" height="100px";>
            </div>    
             <div class="containeritems">
                <img src="bear.jpg" alt="bear.jpg" width="100px" height="100px";>
            </div>    
        </div>   

        <footer>
            <p>&copy; 1675 All Right are Reserverd</p>
            <input type="text"  placeholder="Enter your Email">
            <button>Subscribe</button>
            </footer>
    </body>
    </html>
